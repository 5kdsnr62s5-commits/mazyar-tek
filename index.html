<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وشەی زیندوو</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1330; --ink:#f3eee4; --muted:#9aa0c0; --panel:#171d44; --line:#2c3466;
  --c1:#ffb627; --c2:#ff5d8f; --c3:#2ec4b6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3eee4;--ink:#1a1f4a;--muted:#5d6288;--panel:#fffaf0;--line:#d8d0bf;--c1:#e08a00;--c2:#d6336c;--c3:#0a8f84}}
:root[data-theme="dark"]{--bg:#0e1330;--ink:#f3eee4;--muted:#9aa0c0;--panel:#171d44;--line:#2c3466;--c1:#ffb627;--c2:#ff5d8f;--c3:#2ec4b6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Vazirmatn","Noto Naskh Arabic",Tahoma,sans-serif;overflow:hidden;display:flex;flex-direction:column}
header{padding:18px 22px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;position:relative;z-index:2}
header h1{margin:0;font-size:1.1rem;font-weight:800}
header span{color:var(--muted);font-size:.85rem}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.credit{position:absolute;top:18%;left:0;right:0;text-align:center;direction:ltr;color:var(--muted);font-size:1rem;letter-spacing:.08em;pointer-events:none;transition:opacity 1s}
.credit.off{opacity:0}
footer{position:relative;z-index:2;padding:0 16px 18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button.chip{font:inherit;font-size:.95rem;font-weight:800;color:#3d2300;background:linear-gradient(180deg,#ffe066,#f6b91c);border:2px solid #1f6b4f;border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:0 3px 0 #1f6b4f,0 6px 14px rgba(0,0,0,.25);transition:transform .1s}
button.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #1f6b4f}
button.chip:hover,button.chip:focus-visible{background:linear-gradient(180deg,#ffb36b,#e8643a);color:#fff7e6;outline:2px solid #1f6b4f;outline-offset:2px}
.mode-black{background:#000!important;color:#fff!important;border:2px solid #000!important;box-shadow:0 3px 0 #333!important}
.mode-peach{background:linear-gradient(180deg,#ffd3a8,#ff9f7a)!important;color:#5a1f00!important;border:2px solid #d9653b!important;box-shadow:0 3px 0 #d9653b!important}
input{font:inherit;font-size:1.1rem;width:min(100%,420px);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;text-align:center}
input:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
input::placeholder{color:var(--muted)}
.hint{color:var(--muted);font-size:.8rem;margin:0}
</style>
</head>
<body>
<header><h1>وشەی زیندوو</h1><span>وشەکان لە زەرە پێک دێن</span></header>
<div id="stage"><canvas id="c" aria-label="وشەی زیندوو"></canvas><div class="credit" id="credit">Created by</div></div>
<footer>
  <input id="w" maxlength="14" placeholder="ناوێک یان وشەیەک بنووسە…" autocomplete="off" aria-label="وشە بنووسە">
  <div class="row">
    <button class="chip mode-black" id="modeW" type="button">وشەکان</button>
    <button class="chip mode-peach" id="modeF" type="button">میوە</button>
  </div>
  <div class="row" id="chips"></div>
  <div class="row">
    <button class="chip" id="prev" type="button">← پێشوو</button>
    <button class="chip" id="next" type="button">دواتر →</button>
  </div>
  <p class="hint">بە پەنجە یان مشک بجوڵێنە، یان دوگمەکان بەکاربهێنە</p>
</footer>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),input=document.getElementById('w'),chips=document.getElementById('chips');
  var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var N=2000,W=0,H=0,dpr=1,P=[],ptr={x:-999,y:-999,on:false},cols=[];
  var kurdWords=['سڵاو','کوردستان','خۆشەویستی','ئاسمان','هەولێر'];
  var fruitWords=['مۆز 🍌','خۆخ 🍑','سێو 🍎','ترێ 🍇'];
  var shapeOf={'مۆز 🍌':'banana','خۆخ 🍑':'peach','سێو 🍎':'apple','ترێ 🍇':'grape'};
  var palHex={banana:['#fff27a','#ffc81e','#e89a00','#5b3a1e'],peach:['#ffd1b3','#ffa07a','#ff7a4d','#5b3a1e'],apple:['#ff8080','#f0283c','#b0101e','#4a2a12'],grape:['#d9a6ff','#9b3fe0','#5a1d9e']};
  var pal={},shapeCache={};
  var words=kurdWords,idx=0,auto=true,timer=null,current='',mode3d=false,shapeName='banana',rot=0;

  function hexRGB(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
  Object.keys(palHex).forEach(function(k){pal[k]=palHex[k].map(hexRGB)});
  function readCols(){var s=getComputedStyle(document.documentElement);cols=['--c1','--c2','--c3'].map(function(n){var v=s.getPropertyValue(n).trim();return/^#[0-9a-f]{6}$/i.test(v)?hexRGB(v):[255,255,255]})}
  function colAt(t){t=Math.max(0,Math.min(1,t))*2;var i=Math.min(1,Math.floor(t)),f=t-i,a=cols[i],b=cols[i+1];
    return'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')'}
  function rnd(a,b){return a+Math.random()*(b-a)}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}return a}
  function inBall(cx,cy,cz,r){var u,v,w;do{u=rnd(-1,1);v=rnd(-1,1);w=rnd(-1,1)}while(u*u+v*v+w*w>1);return[cx+u*r,cy+v*r,cz+w*r]}

  function makeShape(name){
    var pts=[],grapes=[];for(var ry=0;ry<4;ry++){for(var rx=0;rx<=ry;rx++){grapes.push([(rx-ry/2)*0.52,-1.2+ry*0.52,0.15*Math.sin(rx*2+ry)])}};
    while(pts.length<N){
      var p;
      if(name!=='grape'&&Math.random()<0.05){
        if(name==='banana'){pts.push([(Math.random()<0.5?-1.12:1.12)+rnd(-0.03,0.03),-0.75+rnd(-0.1,0),rnd(-0.03,0.03),3]);}
        else if(name==='apple'){pts.push([rnd(-0.03,0.03),rnd(-1.3,-0.95),rnd(-0.03,0.03),3]);}
        else{pts.push([rnd(-0.03,0.03),rnd(-1.02,-0.9),rnd(-0.03,0.03),3]);}
        continue;
      }
      if(name==='banana'){
        var t=Math.random(),cx=(t-0.5)*2.2,cy=-0.7+1.0*Math.sin(Math.PI*t),cz=0.35*Math.sin(Math.PI*t)-0.1;
        var rad=0.05+0.26*Math.pow(Math.sin(Math.PI*t),0.5);
        p=inBall(cx,cy,cz,rad);
      }else if(name==='grape'){
        var c=grapes[Math.floor(Math.random()*grapes.length)];
        p=inBall(c[0],c[1],c[2],0.22);
      }else if(name==='apple'){
        p=inBall(0,0,0,1);p[0]*=1.05;p[1]*=0.92;
        if(p[1]<-0.55&&p[0]*p[0]+p[2]*p[2]<0.22)continue;
      }else{
        p=inBall(0,0,0,1);p[1]*=0.92;p[0]*=1.04;
        if(Math.abs(p[0])<0.08&&p[2]>0&&p[1]<0.2)continue;
      }
      pts.push(p);
    }
    return pts;
  }
  function getShape(name){if(!shapeCache[name])shapeCache[name]=makeShape(name);return shapeCache[name]}

  function assignShape(name){
    var pts=getShape(name);
    for(var i=0;i<P.length;i++){
      var p=P[i];
      p.X=pts[i][0];p.Y=pts[i][1];p.Z=pts[i][2];
      p.ci=pts[i][3]!==undefined?pts[i][3]:Math.floor(Math.random()*3);p.idle=false;p.r=1.8+Math.random()*0.9;
      if(!reduced&&!p.idle){p.vx+=(Math.random()-.5)*10;p.vy+=(Math.random()-.5)*10}
    }
  }

  function setWordText(w){
    var off=document.createElement('canvas');off.width=W;off.height=H;
    var o=off.getContext('2d');
    var fs=220;o.font='800 '+fs+'px Vazirmatn, Tahoma, sans-serif';
    var m=o.measureText(w).width||1;
    fs=Math.min(fs*(W*0.86)/m,H*0.5,260);
    o.font='800 '+fs+'px Vazirmatn, Tahoma, sans-serif';
    o.direction=/[A-Za-z]/.test(w)?'ltr':'rtl';
    o.textAlign='center';o.textBaseline='middle';o.fillStyle='#000';
    o.fillText(w,W/2,H/2);
    var d=o.getImageData(0,0,W,H).data,pts=[],step=Math.max(3,Math.round(fs/38));
    for(var y=0;y<H;y+=step)for(var x=0;x<W;x+=step){if(d[((y|0)*(W|0)+(x|0))*4+3]>128)pts.push([x,y])}
    shuffle(pts);
    for(var k=0;k<P.length;k++){
      var p=P[k];
      if(k<pts.length){p.tx=pts[k][0];p.ty=pts[k][1];p.idle=false;p.c=colAt(p.tx/W)}
      else{p.tx=Math.random()*W;p.ty=Math.random()*H;p.idle=true;p.c=colAt(Math.random())}
      if(reduced){p.x=p.tx;p.y=p.ty}
      else if(!p.idle){p.vx+=(Math.random()-.5)*14;p.vy+=(Math.random()-.5)*14}
    }
  }

  function setWord(w){
    current=w;
    if(shapeOf[w]){mode3d=true;shapeName=shapeOf[w];assignShape(shapeName)}
    else{mode3d=false;setWordText(w)}
  }

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    var r=cv.getBoundingClientRect();W=r.width;H=r.height;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    while(P.length<N)P.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,tx:0,ty:0,r:1.2+Math.random()*1.2,c:'#fff',idle:true,X:0,Y:0,Z:0,ci:0});
    P.length=N;
    readCols();
    if(current)setWord(current);
  }

  function frame(){
    ctx.clearRect(0,0,W,H);
    if(mode3d)rot+=0.012;
    var ca=Math.cos(rot),sa=Math.sin(rot),cx=W/2,cy=H/2,S=Math.min(W,H)*0.3;
    var R=Math.min(110,W*0.25),R2=R*R,pl=mode3d?pal[shapeName]:null;
    for(var i=0;i<P.length;i++){
      var p=P[i],k;
      if(mode3d){
        var rx=p.X*ca+p.Z*sa,rz=-p.X*sa+p.Z*ca,f=1+rz*0.12;
        p.tx=cx+rx*S*f;p.ty=cy+p.Y*S*f;p.depth=(rz+1.2)/2.4;
        k=0.14;
      }else k=p.idle?0.004:0.05;
      p.vx+=(p.tx-p.x)*k;p.vy+=(p.ty-p.y)*k;
      if(ptr.on){var dx=p.x-ptr.x,dy=p.y-ptr.y,dd=dx*dx+dy*dy;
        if(dd<R2&&dd>0.01){var dist=Math.sqrt(dd),g=(1-dist/R)*5;p.vx+=dx/dist*g;p.vy+=dy/dist*g}}
      p.vx*=0.86;p.vy*=0.86;p.x+=p.vx;p.y+=p.vy;
      if(mode3d){
        var c3=pl[p.ci],dz=Math.max(0,Math.min(1,p.depth)),dn=0.4+0.6*dz,hl=Math.pow(dz,8)*110;
        ctx.fillStyle='rgb('+Math.min(255,c3[0]*dn+hl|0)+','+Math.min(255,c3[1]*dn+hl|0)+','+Math.min(255,c3[2]*dn+hl|0)+')';
        ctx.globalAlpha=0.95;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r*(0.85+0.4*p.depth),0,6.2832);ctx.fill();
      }else{
        ctx.globalAlpha=p.idle?0.35:0.95;ctx.fillStyle=p.c;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }

  function pos(e){var r=cv.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top;ptr.on=true}
  cv.addEventListener('pointermove',pos);
  cv.addEventListener('pointerleave',function(){ptr.on=false});
  cv.addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')ptr.on=false});
  cv.addEventListener('pointerdown',function(e){
    pos(e);
    if(reduced)return;
    for(var i=0;i<P.length;i++){var p=P[i],dx=p.x-ptr.x,dy=p.y-ptr.y,d=Math.sqrt(dx*dx+dy*dy)+1;
      if(d<220){var f=(1-d/220)*26;p.vx+=dx/d*f;p.vy+=dy/d*f}}
  });

  function stopAuto(){auto=false;clearInterval(timer)}
  function go(d){stopAuto();idx=(idx+d+words.length)%words.length;input.value='';setWord(words[idx])}
  document.getElementById('prev').addEventListener('click',function(){go(-1)});
  document.getElementById('next').addEventListener('click',function(){go(1)});
  var sx=null;
  cv.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  cv.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)go(dx<0?1:-1)});

  function buildChips(){
    chips.innerHTML='';
    words.forEach(function(w){
      var b=document.createElement('button');b.className='chip';b.type='button';b.textContent=w;
      b.addEventListener('click',function(){stopAuto();input.value='';setWord(w)});
      chips.appendChild(b);
    });
  }
  function setMode(list){stopAuto();words=list;idx=0;buildChips();setWord(words[0])}
  document.getElementById('modeW').addEventListener('click',function(){setMode(kurdWords)});
  document.getElementById('modeF').addEventListener('click',function(){setMode(fruitWords)});
  buildChips();

  var deb;
  input.addEventListener('input',function(){
    stopAuto();clearTimeout(deb);
    deb=setTimeout(function(){var v=input.value.trim();if(v)setWord(v)},250);
  });

  window.addEventListener('resize',resize);
  try{var mq=matchMedia('(prefers-color-scheme: light)'),onT=function(){readCols();if(current)setWord(current)};if(mq.addEventListener)mq.addEventListener('change',onT);else if(mq.addListener)mq.addListener(onT)}catch(e){}

  function start(){
    resize();
    setWord('MAZYAR_TẼK');
    setTimeout(function(){document.getElementById('credit').classList.add('off')},3200);
    var n=0;
    if(!reduced)timer=setInterval(function(){if(!auto)return;n=(n+1)%words.length;idx=n;setWord(words[n])},3800);
    frame();
  }
  if(document.fonts&&document.fonts.load){
    Promise.race([document.fonts.load('800 100px Vazirmatn','سڵاو'),new Promise(function(r){setTimeout(r,1500)})]).then(start,start);
  }else start();
})();
</script>
</body>
</html>
